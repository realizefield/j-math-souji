<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>相似｜江原予備校 GAMBA 中学数学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--r:#d62839;--b:#1565c0;--g:#138a36;--p:#7b2cbf;--o:#e07a00;--ink:#1f2933;--mut:#5b6773;--bg:#f2f6fa;--line:#d3dce6;--acc:#0b5ea8}
*{box-sizing:border-box}
body{margin:0;font-family:'BIZ UDGothic','BIZ UDPGothic','BIZ UDゴシック','BIZ UDPゴシック','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;color:var(--ink);background:var(--bg);line-height:1.85;font-size:17px}
select,input,button,textarea{font-family:inherit;font-size:1rem}
header{background:linear-gradient(135deg,#0b5ea8,#1b8fd1);color:#fff;padding:18px 16px 14px}
header .in{max-width:1000px;margin:0 auto}
header small{opacity:.9;letter-spacing:.08em}
header h1{margin:2px 0 4px;font-size:1.6rem}
header p{margin:0;font-size:.95rem;opacity:.95}
nav.tabs{position:sticky;top:0;z-index:30;background:#fff;border-bottom:2px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.06)}
nav.tabs .in{max-width:1000px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 10px}
nav.tabs button{white-space:nowrap;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--ink)}

nav.tabs .bd{display:inline-block;margin-left:6px;font-size:.78rem;background:#e8eef5;color:var(--mut);border-radius:999px;padding:0 7px}

.wrap{max-width:1000px;margin:0 auto;padding:6px 12px 60px}
.unit{display:none}.unit.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.hd{margin:0 0 8px;font-size:1.15rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{background:var(--acc);color:#fff;border-radius:8px;padding:1px 10px;font-size:.88rem;font-weight:700}
.point{background:#fff8e1;border-left:6px solid #f2b705;border-radius:8px;padding:8px 14px;margin:8px 0}
.point ul{margin:4px 0;padding-left:1.3em}
.note{background:#eef6ff;border-left:6px solid #5aa9e6;border-radius:8px;padding:8px 14px;margin:8px 0}
.warn{background:#fdeeee;border-left:6px solid var(--r);border-radius:8px;padding:8px 14px;margin:8px 0}
.cr{color:var(--r);font-weight:700}.cb{color:var(--b);font-weight:700}.cg{color:var(--g);font-weight:700}.cp{color:var(--p);font-weight:700}.co{color:var(--o);font-weight:700}
.ex-q{font-weight:700;margin:2px 0 8px}
.fig{width:100%;height:auto;display:block;background:#fff}
.figbox{border:1px solid var(--line);border-radius:12px;background:#fff;padding:4px;max-width:440px;width:100%}
.figbox.wide{max-width:600px}
svg text{paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.hl-seg{animation:draw .55s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hl-fill{animation:fadein .5s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pulse{animation:pulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse-dot{animation:pop .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.5);opacity:.15}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

@media(max-width:760px){.demo{grid-template-columns:1fr}}

.pl-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pf{margin:6px 0 4px}
.pf-top{display:grid;grid-template-columns:minmax(260px,440px) 1fr;gap:16px;align-items:start}
@media(max-width:760px){.pf-top{grid-template-columns:1fr}}
.pf-stem{font-weight:700;margin:2px 0 8px}
.hbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.hint-intro{color:var(--mut);padding:6px 2px}
.proof{border:2px solid #444;border-radius:10px;padding:10px 14px;margin-top:12px;background:#fff}
.proof-h{font-weight:700;margin-bottom:4px}
.pline{padding:3px 8px;border-radius:8px;margin:2px 0;transition:background .2s}
.pline.flash{background:#fff3b0;box-shadow:0 0 0 2px #f2b705}
select.blank{border:2px solid #7fa6cf;border-radius:8px;padding:1px 4px;background:#f3f9ff;margin:0 2px;max-width:100%}
select.blank.ok{border-color:var(--g);background:#e9f8ee}
select.blank.ng{border-color:var(--r);background:#fdeeee}
.pbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.msg{font-weight:700}
.msg.ok{color:var(--g)}.msg.ng{color:var(--r)}
.qc{border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;background:#fff}
.qh{display:flex;gap:10px;align-items:center}
.qn{background:var(--acc);color:#fff;border-radius:8px;padding:0 10px;font-weight:700}
.qm{color:var(--g);font-weight:700}
.qs{margin:6px 0;font-weight:700}
.qa{margin:8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qa .lbl{font-weight:700}
input.num{width:7.5em;border:2px solid #7fa6cf;border-radius:8px;padding:3px 8px;background:#f3f9ff}
.choices{display:grid;gap:6px;width:100%}
.ch{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.ch.sel{border-color:var(--acc);background:#e8f3fd;font-weight:700}
.qbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.fbk{margin-top:8px;border-radius:10px;padding:0}
.fbk.ok{background:#e9f8ee;border:2px solid var(--g);padding:8px 12px}
.fbk.ng{background:#fdeeee;border:2px solid var(--r);padding:8px 12px}
.fbk .ex{margin-top:4px;font-weight:400}
.hintbox{margin-top:8px;background:#fffbe6;border:2px solid #f2b705;border-radius:10px;padding:6px 12px;display:none}
.bl{line-height:2.3}
.ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0}
.ctl label{cursor:pointer}
.ctl input[type=range]{width:200px;vertical-align:middle}
.readout{background:#f6faff;border:2px solid #bcd7f2;border-radius:10px;padding:6px 12px;margin-top:8px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs2 button{border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:5px 12px;cursor:pointer;font-weight:700}
.tabs2 button.on{background:var(--acc);color:#fff}
.timer{position:sticky;top:52px;z-index:20;background:#fff3cd;border:2px solid #f2b705;border-radius:10px;padding:6px 14px;font-weight:700;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hidden{display:none}
.res{font-size:1.2rem;font-weight:700;text-align:center;padding:14px}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:18px}
</style>

<body>
<header><div class="in">
<small>江原予備校　GAMBA</small>
<h1>中学数学　図形　「相似」</h1>
<p>ゆっくり、ていねいに。「ポイント → 解説 → 例題（ボタンで色が変わる）→ 練習」の順に進みましょう。</p>
</div></header>
<nav class="tabs"><div class="in" id="nav"></div></nav>
<div class="wrap" id="main"></div>
<footer>© 江原予備校　GAMBA　　　図は「正確な縮尺ではありません」。長さは数字の方を信じて考えましょう。</footer>

<script>
'use strict';
/* ================= 基本ユーティリティ ================= */
const NSV='http://www.w3.org/2000/svg';
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.slice(0,2)==='on'&&typeof v==='function')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;};
const sv=(tag,attrs={},parent)=>{const e=document.createElementNS(NSV,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const COL={r:'#d62839',b:'#1565c0',g:'#138a36',p:'#7b2cbf',o:'#e07a00',k:'#1f2933'};
const cs=(c,t)=>`<span class="c${c}">${t}</span>`;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
const lerp=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];
const unitv=(a,b)=>{const d=Math.hypot(a[0]-b[0],a[1]-b[1])||1;return [(a[0]-b[0])/d,(a[1]-b[1])/d];};
const CONDS=['3組の辺の比がすべて等しい','2組の辺の比とその間の角がそれぞれ等しい','2組の角がそれぞれ等しい'];

/* 学習の記録（この端末の中だけに保存） */
const PROG={set:new Set(),tot:{},key:'gamba-soushi-v1',
  load(){try{JSON.parse(localStorage.getItem(this.key)||'[]').forEach(x=>this.set.add(x));}catch(e){}},
  save(){try{localStorage.setItem(this.key,JSON.stringify([...this.set]));}catch(e){}}};
function updateBadges(){document.querySelectorAll('#nav button').forEach(b=>{const u=b.dataset.u;const tot=PROG.tot[u]||0;let d=0;PROG.set.forEach(id=>{if(id.startsWith(u+'-'))d++;});const bd=b.querySelector('.bd');if(bd)bd.textContent=tot?`${Math.min(d,tot)}/${tot}`:'';});}

/* ================= 図のクラス ================= */
class Fig{
  constructor(host,W=380,H=250){
    this.W=W;this.H=H;this.P={};this.lab={};this.cen=null;this.anim=true;
    this.svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,class:'fig',role:'img'});
    host.appendChild(this.svg);
    this.gL=sv('g',{},this.svg);this.gH=sv('g',{},this.svg);this.gT=sv('g',{},this.svg);
  }
  pt(n,x,y,show=true,dx,dy,cen){this.P[n]=[x,y];if(show)this.lab[n]={dx,dy,cen};return this;}
  center(names){const a=(names||Object.keys(this.P)).map(k=>this.P[k]);this.cen=[a.reduce((s,p)=>s+p[0],0)/a.length,a.reduce((s,p)=>s+p[1],0)/a.length];return this;}
  labPos(n){const [x,y]=this.P[n];const L=this.lab[n]||{};let {dx,dy,cen}=L;if(dx===undefined){const c=cen||this.cen||(this.center(),this.cen);const vx=x-c[0],vy=y-c[1],d=Math.hypot(vx,vy)||1;dx=vx/d*15;dy=vy/d*15;}return [x+dx,y+dy];}
  fin(){if(!this.cen)this.center();for(const n in this.lab){const [x,y]=this.labPos(n);this.txt(x,y,n,{s:17,w:700});}return this;}
  seg(a,b,o={}){const [x1,y1]=this.P[a],[x2,y2]=this.P[b];return sv('line',{x1,y1,x2,y2,stroke:o.c||'#1f2933','stroke-width':o.w||2,'stroke-linecap':'round','stroke-dasharray':o.d||'none'},this.gL);}
  poly(ns,o){ns.forEach((n,i)=>this.seg(n,ns[(i+1)%ns.length],o));return this;}
  dot(n,o={}){const [x,y]=this.P[n];sv('circle',{cx:x,cy:y,r:o.r||3.2,fill:o.c||'#1f2933'},this.gL);return this;}
  txt(x,y,s,o={}){const t=sv('text',{x,y,'text-anchor':o.a||'middle','dominant-baseline':'central','font-size':o.s||15,'font-weight':o.w||400,fill:o.c||'#1f2933'},this.gT);t.textContent=s;return t;}
  mid(a,b){return lerp(this.P[a],this.P[b],.5);}
  len(a,b,s,o={}){
    const p=this.P[a],q=this.P[b],m=lerp(p,q,o.at??.5);
    let nx=-(q[1]-p[1]),ny=q[0]-p[0];const L=Math.hypot(nx,ny)||1;nx/=L;ny/=L;
    const c=o.cen||this.cen||(this.center(),this.cen);
    if(nx*(m[0]-c[0])+ny*(m[1]-c[1])<0){nx=-nx;ny=-ny;}
    if((o.dir==='down'&&ny<0)||(o.dir==='up'&&ny>0)||(o.dir==='left'&&nx>0)||(o.dir==='right'&&nx<0)){nx=-nx;ny=-ny;}
    const off=(o.off??15)*(o.side??1);
    const isx=/x/.test(s);
    return this.txt(m[0]+nx*off,m[1]+ny*off,s,{s:o.s||15,c:o.c||(isx?COL.r:undefined),w:o.w||(isx?700:400)});
  }
  par(a,b,n=1,at=.5){const p=this.P[a],q=this.P[b],m=lerp(p,q,at),L=dist(p,q)||1,ux=(q[0]-p[0])/L,uy=(q[1]-p[1])/L,nx=-uy,ny=ux;
    for(let i=0;i<n;i++){const o=(i-(n-1)/2)*8,cx=m[0]+ux*o,cy=m[1]+uy*o;
      sv('path',{d:`M${cx-ux*4+nx*5} ${cy-uy*4+ny*5}L${cx+ux*3} ${cy+uy*3}L${cx-ux*4-nx*5} ${cy-uy*4-ny*5}`,fill:'none',stroke:'#1f2933','stroke-width':1.7,'stroke-linecap':'round'},this.gL);}
    return this;}
  tick(a,b,n=1,at=.5){const p=this.P[a],q=this.P[b],m=lerp(p,q,at),L=dist(p,q)||1,ux=(q[0]-p[0])/L,uy=(q[1]-p[1])/L,nx=-uy,ny=ux;
    for(let i=0;i<n;i++){const o=(i-(n-1)/2)*5,cx=m[0]+ux*o,cy=m[1]+uy*o;
      sv('line',{x1:cx+nx*6,y1:cy+ny*6,x2:cx-nx*6,y2:cy-ny*6,stroke:'#1f2933','stroke-width':1.8,'stroke-linecap':'round'},this.gL);}
    return this;}
  _ang(v,p1,p2){const V=this.P[v],A=this.P[p1],B=this.P[p2];const a1=Math.atan2(A[1]-V[1],A[0]-V[0]),a2=Math.atan2(B[1]-V[1],B[0]-V[0]);let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<=-Math.PI)d+=2*Math.PI;return {V,a1,d,sw:d>0?1:0};}
  _ap(V,a,r){return [V[0]+r*Math.cos(a),V[1]+r*Math.sin(a)];}
  arc(v,p1,p2,r=22,txt,o={}){const g=this._ang(v,p1,p2);const s=this._ap(g.V,g.a1,r),e=this._ap(g.V,g.a1+g.d,r);
    sv('path',{d:`M${s[0]} ${s[1]}A${r} ${r} 0 0 ${g.sw} ${e[0]} ${e[1]}`,fill:'none',stroke:o.c||'#1f2933','stroke-width':o.w||1.8},this.gL);
    if(txt){const t=this._ap(g.V,g.a1+g.d/2,r+(o.tr??16));this.txt(t[0],t[1],txt,{s:o.s||13,c:o.c});}
    return this;}
  right(v,p1,p2,s=13){const V=this.P[v],ua=unitv(this.P[p1],V),ub=unitv(this.P[p2],V);
    const p=[V[0]+ua[0]*s,V[1]+ua[1]*s],r=[V[0]+ub[0]*s,V[1]+ub[1]*s],q=[p[0]+ub[0]*s,p[1]+ub[1]*s];
    sv('path',{d:`M${p[0]} ${p[1]}L${q[0]} ${q[1]}L${r[0]} ${r[1]}`,fill:'none',stroke:'#1f2933','stroke-width':1.6},this.gL);return this;}
  /* --- ハイライト（色つき） --- */
  clear(){while(this.gH.firstChild)this.gH.removeChild(this.gH.firstChild);}
  hSeg(a,b,c,w=5.5,op=1){const [x1,y1]=this.P[a],[x2,y2]=this.P[b];return this.hLn([x1,y1],[x2,y2],c,w,op);}
  hLn(p,q,c,w=5.5,op=1,dash){const L=dist(p,q);const at={x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:c,'stroke-width':w,'stroke-linecap':'round','stroke-opacity':op};
    if(dash)at['stroke-dasharray']=dash;else if(this.anim){at.class='hl-seg';at.style=`stroke-dasharray:${L};stroke-dashoffset:${L}`;}
    return sv('line',at,this.gH);}
  hTri(ns,c,a=.2){sv('polygon',{points:ns.map(n=>this.P[n].join(',')).join(' '),fill:c,'fill-opacity':a,stroke:c,'stroke-width':2.5,'stroke-linejoin':'round',class:this.anim?'hl-fill':''},this.gH);}
  hPt(n,c,r=7){const [x,y]=this.P[n];sv('circle',{cx:x,cy:y,r:r+5,fill:c,'fill-opacity':.25,class:this.anim?'pulse':''},this.gH);sv('circle',{cx:x,cy:y,r,fill:c,stroke:'#fff','stroke-width':2},this.gH);}
  hAng(v,p1,p2,r,c,dot=true){const g=this._ang(v,p1,p2);const s=this._ap(g.V,g.a1,r),e=this._ap(g.V,g.a1+g.d,r);
    sv('path',{d:`M${g.V[0]} ${g.V[1]}L${s[0]} ${s[1]}A${r} ${r} 0 0 ${g.sw} ${e[0]} ${e[1]}Z`,fill:c,'fill-opacity':.3,stroke:c,'stroke-width':2.2,class:this.anim?'hl-fill':''},this.gH);
    if(dot){const q=this._ap(g.V,g.a1+g.d/2,r*.62);sv('circle',{cx:q[0],cy:q[1],r:5.5,fill:c,stroke:'#fff','stroke-width':1.5,class:this.anim?'pulse-dot':''},this.gH);}}
  hTxt(x,y,s,c,size=15){const t=sv('text',{x,y,'text-anchor':'middle','dominant-baseline':'central','font-size':size,'font-weight':700,fill:c,class:this.anim?'hl-fill':''},this.gH);t.textContent=s;}
  hLab(n,c,dx,dy){let [x,y]=this.labPos(n);if(dx!==undefined){x=this.P[n][0]+dx;y=this.P[n][1]+dy;}this.hTxt(x,y,n,c,17);}
}
/* 対応する辺のペアに同じ色をつける。長い方をうすく下に、短い方を太く上に */
function PH(f,list){list.forEach(([a1,a2,b1,b2,ck])=>{const c=COL[ck];const la=dist(f.P[a1],f.P[a2]),lb=dist(f.P[b1],f.P[b2]);
  const [lg,sh]=la>=lb?[[a1,a2],[b1,b2]]:[[b1,b2],[a1,a2]];f.hSeg(lg[0],lg[1],c,4,.45);f.hSeg(sh[0],sh[1],c,7.5,1);});}

/* ================= ステップ再生（ボタンで1つずつ） ================= */
function Player(host,f,steps,o={}){
  const box=h('div',{class:'pl'}),log=h('div',{class:'pl-log'}),bar=h('div',{class:'pl-bar'});
  let i=-1;
  const b1=h('button',{class:'btn sm ghost',type:'button'},'◀ もどる'),b2=h('button',{class:'btn sm',type:'button'},'つぎへ ▶'),b3=h('button',{class:'btn sm ghost',type:'button'},'ぜんぶ見る'),b4=h('button',{class:'btn sm ghost',type:'button'},'はじめから');
  bar.append(b1,b2,b3,b4);box.append(log,bar);host.append(box);
  function go(n){
    i=Math.max(-1,Math.min(steps.length-1,n));
    f.clear();let s0=0;for(let j=0;j<=i;j++)if(steps[j].reset)s0=j;
    for(let j=s0;j<=i;j++){f.anim=(j===i);if(steps[j].hl)steps[j].hl(f);}
    f.anim=true;
    log.innerHTML='';
    if(i<0)log.append(h('div',{class:'pl-s intro',html:o.intro||'「つぎへ」を押すと、1つずつ図に色がつきます。'}));
    for(let j=0;j<=i;j++)log.append(h('div',{class:'pl-s'+(j===i?' cur':''),html:steps[j].text}));
    b1.disabled=i<0;b2.disabled=i>=steps.length-1;b2.textContent=i>=steps.length-1?'おわり':'つぎへ ▶';
    if(o.onStep)o.onStep(i>=0?steps[i]:null,i);

const cmul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]];
const cdiv=(a,b)=>{const d=b[0]*b[0]+b[1]*b[1];return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d];};
const vsub=(a,b)=>[a[0]-b[0],a[1]-b[1]],vadd=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const spiral=(A,P,Q,R)=>{const m=cdiv(vsub(Q,A),vsub(P,A));return vadd(A,cmul(m,vsub(R,A)));};
const rotP=(p,c,th)=>vadd(c,cmul([Math.cos(th),Math.sin(th)],vsub(p,c)));
const isect=(p1,p2,p3,p4)=>{const d1=vsub(p2,p1),d2=vsub(p4,p3),den=d1[0]*d2[1]-d1[1]*d2[0];const t=((p3[0]-p1[0])*d2[1]-(p3[1]-p1[1])*d2[0])/den;return [p1[0]+d1[0]*t,p1[1]+d1[1]*t];};
const foot=(p,a,b)=>{const d=vsub(b,a),t=((p[0]-a[0])*d[0]+(p[1]-a[1])*d[1])/(d[0]*d[0]+d[1]*d[1]);return [a[0]+d[0]*t,a[1]+d[1]*t];};
function G(f,pts,segs,o={}){

}

function figTrapDiag(f,o){
  const bc=300,ad=bc*o.AD/o.BC,B=[40,210],C=[340,210],A=[B[0]+(bc-ad)*.3,50],D=[A[0]+ad,50];
  const E=lerp(A,B,.5),F=lerp(D,C,.5);
  f.pt('A',...A).pt('B',...B).pt('C',...C).pt('D',...D).pt('E',...E).pt('F',...F);
  f.center(['A','B','C','D']);
  f.poly(['A','B','C','D']);f.seg('E','F');f.dot('E');f.dot('F');
  const dg=o.diag||'AC';
  if(dg==='AC'||dg==='both'){f.seg('A','C');}
  if(dg==='BD'||dg==='both'){f.seg('B','D');}
  if(dg==='AC'){const G=isect(E,F,A,C);f.pt('G',...G,true,0,-14);f.dot('G');}
  if(dg==='BD'){const G=isect(E,F,B,D);f.pt('G',...G,true,0,-14);f.dot('G');}
  if(dg==='both'){const G=isect(E,F,B,D),H=isect(E,F,A,C);f.pt('G',...G,true,0,14).pt('H',...H,true,0,14);f.dot('G');f.dot('H');}
  f.par('A','D');f.par('B','C');f.par('E','F');

      choices:['3：1','2：1','4：1','3：2'],ans:0,explain:'△ADCで、E は AC の中点、EG∥DC なので G は AD の中点（GE＝（1/2）DC＝（1/2）BD）。△GFE∽△DFB（GE：DB＝1：2）より GF：FD＝1：2。AG＝GD＝GF＋FD＝3GF なので AG：GF＝3：1。',
      hint:{t:'△ADC で EG は中点連結定理（G は AD の中点）。そのあと △GFE∽△DFB で GF：FD を出します。',hl:HL(TRI(['A','D','C'],COL.r,.1),SEG('E','G',COL.r),TRI(['G','F','E'],COL.b,.2),TRI(['D','F','B'],COL.p,.12))}}
  ]);
  r.append(p4);
}

/* ================= 起動 ================= */
const UNITS=[
  ['① 相似とは','u1','相似とは',buildU1],['② 相似条件','u2','三角形の相似条件',buildU2],
  ['③ 証明（辺の比）','u3','相似の証明①',buildU3],['④ 証明（角）','u4','相似の証明②',buildU4],
  ['⑤ 長さ（DE//BC）','u5','相似を使って長さを求める①',buildU5],['⑥ 長さ（全体・平行線）','u6','相似を使って長さを求める②',buildU6],
  ['⑦ 長さ（台形）','u7','相似を使って長さを求める③',buildU7],['⑧ 中点連結定理','u8','中点連結定理',buildU8],
  ['⑨ 証明の応用','u10','相似の証明（応用）',r=>{buildU10(r);buildU10c(r);buildU10d(r);}],
  ['⑩ 中点連結定理の応用','u11','中点連結定理（応用）',r=>{buildU11(r);buildU11b(r);}],
  ['⑪ 総合テスト','u9','総合確認テスト',buildU9]];
function init(){
  PROG.load();
  const nav=document.getElementById('nav'),main=document.getElementById('main');
  UNITS.forEach(([label,u,title,fn],i)=>{
    const sec=h('section',{class:'unit',id:u});
    sec.append(h('h2',{style:'margin:14px 0 0;font-size:1.3rem',html:`${'①②③④⑤⑥⑦⑧⑨⑩⑪'[i]} ${title}`}));
    try{fn(sec);}catch(e){console.error(u,e);sec.append(h('div',{class:'warn',html:'このページの読み込みでエラーが起きました：'+e.message}));}
    if(i<UNITS.length-1){const nx=h('div',{class:'pbtn',style:'justify-content:flex-end;margin:14px 0'},h('button',{class:'btn',type:'button',onclick:()=>show(u2(i+1))},`つぎへ：${UNITS[i+1][0]} ▶`));sec.append(nx);}
    main.append(sec);
    nav.append(h('button',{type:'button','data-u':u,onclick:()=>show(u)},label,h('span',{class:'bd'})));
  });
  function u2(i){return UNITS[i][1];}
  function show(u){document.querySelectorAll('.unit').forEach(e=>e.classList.toggle('on',e.id===u));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.u===u));window.scrollTo({top:0,behavior:'smooth'});}
  window.__show=show;
  show('u1');updateBadges();
}
init();
</script>
